name: Release

on:
  push:
    branches:
      - prod

permissions:
  contents: read

# Serializa execuções deste workflow: dois pushes rápidos em prod não devem
# gerar duas releases publicando ao mesmo tempo. cancel-in-progress fica
# desligado de propósito — uma execução já publicando artefatos não deve
# ser interrompida no meio, a próxima só começa depois que essa terminar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versao:
    name: Carimbar a atualização com a data de hoje
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      publicar: ${{ steps.versao.outputs.publicar }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determinar o carimbo da atualização
        id: versao
        # O produto não tem número de versão. Cada push em prod publica uma
        # atualização carimbada com a data (UTC); quando já houve uma release
        # hoje, cai para .1, .2… O carimbo serve só para rastreabilidade e para
        # o atualizador embutido comparar "mais nova".
        run: |
          sha="${{ github.sha }}"
          if git ls-remote --tags origin 'refs/tags/v*' | grep -qE "^${sha}[[:space:]]"; then
            echo "Commit ${sha} já tem uma tag v* — re-execução do workflow, nada a publicar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(date -u +%Y.%-m.%-d)"
          versao="$base"
          n=0
          while git ls-remote --exit-code --tags origin "refs/tags/v${versao}" > /dev/null 2>&1; do
            n=$((n + 1))
            versao="${base}.${n}"
          done
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "publicar=true" >> "$GITHUB_OUTPUT"
          echo "Vou publicar a atualização v${versao}."

  testar:
    name: Compilar e testar antes de lançar
    needs: versao
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurar dependências
        run: dotnet restore CofreDeSenhas.sln

      - name: Compilar
        # App.Testes é multi-target (inclui net10.0-windows... para o código exclusivo do
        # Windows Hello); este job roda em ubuntu-latest, então fica restrito à TFM sem
        # sufixo de SO — o binário -windows nunca deve ser carregado fora do Windows.
        # -m:1 desliga o paralelismo de projetos do MSBuild — em runner Linux real, dois nós
        # de build podem escrever GerenciadorDeSenhas.deps.json ao mesmo tempo (referenciado
        # por vários projetos da solução) e o GenerateDepsFile falha com arquivo em uso.
        run: dotnet build CofreDeSenhas.sln -c Release --no-restore -m:1 --framework net10.0

      - name: Executar testes
        # IntegracaoBanco fica de fora do gate de release: precisa dos containers de
        # Postgres/MySQL/SQL Server que só existem no job testar-bancos do ci.yml.
        run: dotnet test CofreDeSenhas.sln -c Release --no-build --verbosity normal --filter "Category!=IntegracaoBanco" --framework net10.0

  build-windows:
    name: Gerar artefatos do Windows
    needs: [ versao, testar ]
    if: needs.versao.outputs.publicar == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Garantir Inno Setup instalado
        shell: pwsh
        run: |
          $candidatos = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc -and -not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Inno Setup não encontrado, instalando via Chocolatey..."
            choco install innosetup -y --no-progress
          }

      - name: Publicar executável e gerar instalador
        # Os secrets WINDOWS_CERT_* ativam a assinatura Authenticode dentro do
        # gerar-instalador.ps1 (executável e instalador). Sem eles, o passo de
        # assinatura não faz nada — mesma convenção da assinatura GPG opcional.
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .\App\distribuicao\gerar-instalador.ps1 -Versao "${{ needs.versao.outputs.versao }}"

      - name: Publicar o gerador de senhas standalone
        # Só o executável portátil autocontido, sem instalador próprio: é uma
        # variante de conveniência do mesmo gerador que já vive dentro do Cofre.
        shell: pwsh
        run: |
          dotnet publish Gerador\Gerador.csproj `
            -f net10.0-windows10.0.19041.0 -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ needs.versao.outputs.versao }} `
            -o publish-gerador

      - name: Assinar o gerador standalone (Authenticode, opcional)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .\App\distribuicao\assinar-windows.ps1 publish-gerador\GeradorDeSenhas.exe

      - name: Publicar o CLI
        # Executável de linha de comando somente-leitura (listar/buscar/mostrar/
        # copiar/gerar). Referencia só o núcleo, sem Avalonia.
        shell: pwsh
        run: |
          dotnet publish Cli\Cli.csproj `
            -f net10.0 -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ needs.versao.outputs.versao }} `
            -o publish-cli

      - name: Assinar o CLI (Authenticode, opcional)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .\App\distribuicao\assinar-windows.ps1 publish-cli\cofre.exe

      - name: Empacotar os executáveis portáteis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "publish\CofreDeSenhas.exe" "dist\CofreDeSenhas-${{ needs.versao.outputs.versao }}-win-x64-portatil.exe"
          Copy-Item "publish-gerador\GeradorDeSenhas.exe" "dist\GeradorDeSenhas-${{ needs.versao.outputs.versao }}-win-x64-portatil.exe"
          Copy-Item "publish-cli\cofre.exe" "dist\cofre-${{ needs.versao.outputs.versao }}-win-x64.exe"

      - name: Enviar artefatos do Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artefatos-windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Gerar artefato do Linux
    needs: [ versao, testar ]
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publicar (linux-x64, autocontido)
        run: |
          dotnet publish App/App.csproj -f net10.0 -c Release -r linux-x64 \
            --self-contained true -p:Version=${{ needs.versao.outputs.versao }} -o publish-linux

      - name: Publicar o CLI (linux-x64)
        run: |
          dotnet publish Cli/Cli.csproj -f net10.0 -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ needs.versao.outputs.versao }} -o publish-cli

      - name: Empacotar em tar.gz
        run: |
          mkdir -p dist
          tar -czf "dist/CofreDeSenhas-${{ needs.versao.outputs.versao }}-linux-x64.tar.gz" -C publish-linux .
          cp publish-cli/cofre "dist/cofre-${{ needs.versao.outputs.versao }}-linux-x64"
          chmod +x "dist/cofre-${{ needs.versao.outputs.versao }}-linux-x64"

      - name: Gerar AppImage
        run: |
          chmod +x App/distribuicao/gerar-appimage.sh
          ./App/distribuicao/gerar-appimage.sh "${{ needs.versao.outputs.versao }}"

      - name: Enviar artefato do Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artefatos-linux
          path: dist/*
          if-no-files-found: error

  publicar-release:
    name: Publicar release
    needs: [ versao, build-windows, build-linux ]
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Baixar artefatos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefatos
          merge-multiple: true

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Gerar SBOM (CycloneDX)
        run: |
          mkdir -p dist
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet-CycloneDX CofreDeSenhas.sln -o dist -sn CofreDeSenhas \
            -sv "${{ needs.versao.outputs.versao }}" -F Json \
            -fn "CofreDeSenhas-${{ needs.versao.outputs.versao }}-sbom.json"

      - name: Gerar manifests winget
        # Só monta os YAML prontos para o mantenedor copiar num fork de microsoft/winget-pkgs
        # e abrir o PR manualmente — submissão automática num repositório de terceiros fica
        # fora do escopo deste pipeline. Roda antes do CHECKSUMS.txt de propósito, pra esse
        # zip também entrar na lista de checksums publicada.
        run: |
          versao="${{ needs.versao.outputs.versao }}"
          sha256_instalador=$(sha256sum "artefatos/CofreDeSenhas-Setup-$versao.exe" | cut -d' ' -f1)
          python3 .github/scripts/gerar_manifesto_winget.py "$versao" "$sha256_instalador" winget-manifests
          mkdir -p dist
          (cd winget-manifests && zip -r "../dist/winget-manifests-$versao.zip" manifests)

      - name: Gerar CHECKSUMS.txt
        run: |
          mkdir -p dist
          cp artefatos/* dist/
          cd dist
          sha256sum * > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Assinar CHECKSUMS.txt
        # Assinatura destacada conferida pelo atualizador embutido (ServicoAtualizacao)
        # contra a chave pública fixa no binário, antes de executar qualquer coisa
        # baixada — sem isto o cliente confiaria só no SHA256 de um CHECKSUMS.txt sem
        # assinatura, que um comprometimento da release trocaria junto com o instalador.
        env:
          CHAVE_ASSINATURA: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$CHAVE_ASSINATURA" ]; then
            echo "Secret UPDATE_SIGNING_KEY não configurado — obrigatório para assinar a atualização." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$CHAVE_ASSINATURA" > chave-assinatura.pem
          openssl pkey -in chave-assinatura.pem -pubout -out chave-assinatura.pub
          openssl dgst -sha256 -sign chave-assinatura.pem -out dist/CHECKSUMS.txt.sig dist/CHECKSUMS.txt
          openssl dgst -sha256 -verify chave-assinatura.pub -signature dist/CHECKSUMS.txt.sig dist/CHECKSUMS.txt
          rm -f chave-assinatura.pem chave-assinatura.pub
          echo "CHECKSUMS.txt.sig gerado."

      - name: Assinar CHECKSUMS.txt com GPG
        # Assinatura complementar à RSA acima, na convenção que as ferramentas de
        # linha de comando do Linux esperam (gpg --verify). É opcional: sem o
        # secret GPG_PRIVATE_KEY o passo se ignora sem falhar — quem valida a
        # atualização automática continua conferindo a assinatura RSA.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Secret GPG_PRIVATE_KEY não configurado — pulando a assinatura GPG (opcional)."
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$fpr" ]; then
            echo "Não consegui ler a impressão digital da chave GPG importada." >&2
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$fpr" --armor --detach-sign --output dist/CHECKSUMS.txt.asc dist/CHECKSUMS.txt
          gpg --batch --verify dist/CHECKSUMS.txt.asc dist/CHECKSUMS.txt
          gpg --batch --armor --export "$fpr" > dist/CofreDeSenhas-gpg-public-key.asc
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          echo "CHECKSUMS.txt.asc gerado (chave GPG $fpr)."

      - name: Assinar proveniência dos artefatos (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Criar e publicar release
        # generate_release_notes deixa o GitHub montar o corpo a partir dos commits
        # e PRs desde a última tag — não há mais CHANGELOG.md nem modelo próprio.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: dist/*

      - name: Enviar artefatos ao VirusTotal
        # Opcional e best-effort: sem o secret VT_API_KEY o passo é pulado, e uma
        # falha do VirusTotal (cota diária, tamanho de arquivo ou rate limit da
        # conta gratuita) não derruba a publicação. Com update_release_body, os
        # links dos relatórios entram no corpo da release já publicada.
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_release_body: true
          request_rate: 4
          files: |
            dist/CofreDeSenhas-Setup-*.exe
            dist/CofreDeSenhas-*-win-x64-portatil.exe
            dist/GeradorDeSenhas-*-win-x64-portatil.exe
            dist/cofre-*-win-x64.exe
