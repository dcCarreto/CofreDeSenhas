name: Release

on:
  push:
    branches:
      - prod

permissions:
  contents: read

# Serializa execuções deste workflow: dois pushes rápidos em prod não devem
# gerar duas releases publicando ao mesmo tempo. cancel-in-progress fica
# desligado de propósito — uma execução já publicando artefatos não deve
# ser interrompida no meio, a próxima só começa depois que essa terminar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar-versao:
    name: Verificar se há uma versão nova para lançar
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      deve_lancar: ${{ steps.check.outputs.deve_lancar }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determinar versão
        id: versao
        run: |
          ocorrencias=$(grep -c '<Version>' App/App.csproj || true)
          if [ "$ocorrencias" -ne 1 ]; then
            echo "Esperava exatamente uma tag <Version> em App/App.csproj, encontrei $ocorrencias." >&2
            exit 1
          fi

          versao=$(grep -oP '(?<=<Version>)[^<]+' App/App.csproj)
          if [ -z "$versao" ]; then
            echo "Não foi possível determinar a versão em App/App.csproj." >&2
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

      - name: Verificar se essa versão já foi lançada
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.versao.outputs.versao }}" > /dev/null 2>&1; then
            echo "Versão v${{ steps.versao.outputs.versao }} já foi lançada antes, nada a fazer."
            echo "deve_lancar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versão v${{ steps.versao.outputs.versao }} é nova, vou lançar."
            echo "deve_lancar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar seção da versão no CHANGELOG.md
        if: steps.check.outputs.deve_lancar == 'true'
        run: python3 .github/scripts/montar_notas_release.py "${{ steps.versao.outputs.versao }}" --check-only

  testar:
    name: Compilar e testar antes de lançar
    needs: verificar-versao
    if: needs.verificar-versao.outputs.deve_lancar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurar dependências
        run: dotnet restore CofreDeSenhas.sln

      - name: Compilar
        # App.Testes é multi-target (inclui net10.0-windows... para o código exclusivo do
        # Windows Hello); este job roda em ubuntu-latest, então fica restrito à TFM sem
        # sufixo de SO — o binário -windows nunca deve ser carregado fora do Windows.
        run: dotnet build CofreDeSenhas.sln -c Release --no-restore --framework net10.0

      - name: Executar testes
        # IntegracaoBanco fica de fora do gate de release: precisa dos containers de
        # Postgres/MySQL/SQL Server que só existem no job testar-bancos do ci.yml.
        run: dotnet test CofreDeSenhas.sln -c Release --no-build --verbosity normal --filter "Category!=IntegracaoBanco" --framework net10.0

  build-windows:
    name: Gerar artefatos do Windows
    needs: [ verificar-versao, testar ]
    if: needs.verificar-versao.outputs.deve_lancar == 'true' && needs.testar.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Garantir Inno Setup instalado
        shell: pwsh
        run: |
          $candidatos = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc -and -not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Inno Setup não encontrado, instalando via Chocolatey..."
            choco install innosetup -y --no-progress
          }

      - name: Publicar executável e gerar instalador
        shell: pwsh
        run: .\App\distribuicao\gerar-instalador.ps1 -Versao "${{ needs.verificar-versao.outputs.versao }}"

      - name: Empacotar o executável portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "publish\CofreDeSenhas.exe" "dist\CofreDeSenhas-${{ needs.verificar-versao.outputs.versao }}-win-x64-portatil.exe"

      - name: Enviar artefatos do Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artefatos-windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Gerar artefato do Linux
    needs: [ verificar-versao, testar ]
    if: needs.verificar-versao.outputs.deve_lancar == 'true' && needs.testar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publicar (linux-x64, autocontido)
        run: |
          dotnet publish App/App.csproj -f net10.0 -c Release -r linux-x64 \
            --self-contained true -o publish-linux

      - name: Empacotar em tar.gz
        run: |
          mkdir -p dist
          tar -czf "dist/CofreDeSenhas-${{ needs.verificar-versao.outputs.versao }}-linux-x64.tar.gz" -C publish-linux .

      - name: Gerar AppImage
        run: |
          chmod +x App/distribuicao/gerar-appimage.sh
          ./App/distribuicao/gerar-appimage.sh "${{ needs.verificar-versao.outputs.versao }}"

      - name: Enviar artefato do Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artefatos-linux
          path: dist/*
          if-no-files-found: error

  publicar-release:
    name: Publicar release
    needs: [ verificar-versao, build-windows, build-linux ]
    if: |
      needs.verificar-versao.outputs.deve_lancar == 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Baixar artefatos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefatos
          merge-multiple: true

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Gerar SBOM (CycloneDX)
        run: |
          mkdir -p dist
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet-CycloneDX CofreDeSenhas.sln -o dist -sn CofreDeSenhas \
            -sv "${{ needs.verificar-versao.outputs.versao }}" -F Json \
            -fn "CofreDeSenhas-${{ needs.verificar-versao.outputs.versao }}-sbom.json"

      - name: Gerar manifests winget
        # Só monta os YAML prontos para o mantenedor copiar num fork de microsoft/winget-pkgs
        # e abrir o PR manualmente — submissão automática num repositório de terceiros fica
        # fora do escopo deste pipeline. Roda antes do CHECKSUMS.txt de propósito, pra esse
        # zip também entrar na lista de checksums publicada.
        run: |
          versao="${{ needs.verificar-versao.outputs.versao }}"
          sha256_instalador=$(sha256sum "artefatos/CofreDeSenhas-Setup-$versao.exe" | cut -d' ' -f1)
          python3 .github/scripts/gerar_manifesto_winget.py "$versao" "$sha256_instalador" winget-manifests
          mkdir -p dist
          (cd winget-manifests && zip -r "../dist/winget-manifests-$versao.zip" manifests)

      - name: Gerar CHECKSUMS.txt
        run: |
          mkdir -p dist
          cp artefatos/* dist/
          cd dist
          sha256sum * > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Montar notas da release
        run: python3 .github/scripts/montar_notas_release.py "${{ needs.verificar-versao.outputs.versao }}"

      - name: Assinar proveniência dos artefatos (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Criar e publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.verificar-versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: false
          body_path: release-notes.md
          files: dist/*
