name: CI

on:
  push:
    branches: [ prod, prodUnstable ]
  pull_request:
    branches: [ prod, prodUnstable ]

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework_arg: ''
          - os: ubuntu-latest
            # App.Testes é multi-target (inclui net10.0-windows...) para compilar e testar
            # o código exclusivo do Windows Hello (#if WINDOWS). No Linux, restringe à TFM
            # sem sufixo de SO — o binário -windows nunca deve ser carregado fora do Windows.
            framework_arg: '--framework net10.0'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurar dependências
        run: dotnet restore CofreDeSenhas.sln

      - name: Compilar
        run: dotnet build CofreDeSenhas.sln -c Release --no-restore ${{ matrix.framework_arg }}

      - name: Executar testes
        # IntegracaoBanco fica de fora aqui (roda só no job testar-bancos, contra os
        # containers de Postgres/MySQL/SQL Server) — sem eles, essa categoria falharia
        # por não achar nenhum motor real escutando em localhost.
        run: dotnet test CofreDeSenhas.sln -c Release --no-build --verbosity normal --filter "Category!=IntegracaoBanco" ${{ matrix.framework_arg }}

  verificar-vulnerabilidades:
    name: Verificar pacotes NuGet vulneráveis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurar dependências
        run: dotnet restore CofreDeSenhas.sln

      - name: Verificar pacotes vulneráveis
        # "dotnet list package --vulnerable" sempre sai com código 0, mesmo achando
        # vulnerabilidade — só imprime um aviso. Grep na saída pra falhar de verdade.
        run: |
          saida=$(dotnet list CofreDeSenhas.sln package --vulnerable --include-transitive --no-restore)
          echo "$saida"
          if echo "$saida" | grep -qi "has the following vulnerable packages"; then
            echo "Pacotes NuGet vulneráveis encontrados — veja a lista acima." >&2
            exit 1
          fi

  testar-bancos:
    name: Testar integração com Postgres/MySQL/SQL Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cofretest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cofretest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CofreDeSenhas!Teste123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CofreDeSenhas!Teste123' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurar dependências
        run: dotnet restore GerenciadorDeSenhas.Testes/GerenciadorDeSenhas.Testes.csproj

      - name: Rodar testes de integração de banco
        # Alguns retries: mesmo com --health-cmd configurado nos três containers, a
        # primeira tentativa de login pode ainda pegar o banco terminando de
        # inicializar (principalmente o SQL Server, cujo healthcheck depende do
        # caminho do sqlcmd dentro da imagem, mais frágil que os outros dois).
        run: |
          for tentativa in 1 2 3; do
            if dotnet test GerenciadorDeSenhas.Testes/GerenciadorDeSenhas.Testes.csproj -c Release --filter "Category=IntegracaoBanco" --verbosity normal; then
              exit 0
            fi
            echo "Tentativa $tentativa falhou, aguardando os bancos terminarem de inicializar..."
            sleep 15
          done
          exit 1
