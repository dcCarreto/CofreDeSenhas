name: CI

on:
  push:
    branches: [ prod, prodUnstable ]
  pull_request:
    branches: [ prod, prodUnstable ]

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore CofreDeSenhas.sln

      - name: Compilar
        run: dotnet build CofreDeSenhas.sln -c Release --no-restore

      - name: Executar testes
        run: dotnet test CofreDeSenhas.sln -c Release --no-build --verbosity normal
